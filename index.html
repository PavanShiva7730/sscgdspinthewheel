<div id="spin-wrap" style="perspective:700px;width:250px;height:250px;margin:40px auto;display:flex;align-items:center;justify-content:center;">
  <div id="spin-box" style="width:170px;height:170px;position:relative;transform-style:preserve-3d;transition:transform 2s cubic-bezier(.45,1.3,.45,1.05);">
    <!-- Phase 1 -->
    <div style="position:absolute;width:170px;height:170px;background:#22e46a;box-shadow:0 12px 40px 0 #22e46a77;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:18px;color:#fff;font-size:22px;font-weight:900;transform:rotateY(0deg) translateZ(85px);">
      SPIN to WIN
    </div>

    <!-- Phase 2 -->
    <div style="position:absolute;width:170px;height:170px;background:#2f60ff;box-shadow:0 12px 40px 0 #2f60ff88;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:18px;color:#fff;font-size:19px;font-weight:900;transform:rotateY(90deg) translateZ(85px);">
      Mock Test + PYQ + Doubt Classes
    </div>

    <!-- Phase 3 -->
    <div style="position:absolute;width:170px;height:170px;background:#ff3c79;box-shadow:0 12px 40px 0 #ff3c7988;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:18px;color:#fff;font-size:17px;font-weight:900;transform:rotateY(180deg) translateZ(85px);">
      FREE Live +<br>Recorded Classes
    </div>

    <!-- Phase 4 (Winning Spot) -->
    <div style="position:absolute;width:170px;height:170px;background:linear-gradient(120deg,#ffe259 70%,#ffa751 100%);box-shadow:0 12px 40px 0 #ffd43b88;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:18px;color:#764c00;font-size:17px;font-weight:900;transform:rotateY(-90deg) translateZ(85px);">
      Mock Test + PYQs +<br>Doubt Classes at ₹1
    </div>
  </div>
</div>

<div style="text-align:center;">
  <button id="spinBtn"
    style="padding:14px 36px;background:#262626;color:#fff;font-size:19px;font-weight:700;border:none;border-radius:9px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.16);">
    Spin
  </button>
</div>

<!-- Popup -->
<div id="popup-congrats" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(15,23,42,0.35);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:linear-gradient(120deg,#fffbe6 60%,#ffebb0 100%);border-radius:18px;padding:40px 28px;box-shadow:0 8px 44px 0 #f1c75b44;text-align:center;max-width:330px;margin:auto;">

    <div style="font-size:30px; font-weight:900; color:#ffb300; margin-bottom:14px;">🎉 Congratulations!</div>

    <div style="font-size:19px; color:#664700; margin-bottom:20px;">
      You won<br>
      <span style="font-weight:700;color:#fa8c16;">SSC GD Mock Test + PYQs + Live Classes at ₹1</span>
    </div>

    <!-- Redeem Now Button -->
    <a href="https://testbk.co/1hwkg" target="_blank"
      style="display:inline-block;background:#22c55e;color:#fff;font-size:18px;font-weight:700;padding:12px 34px;border-radius:8px;box-shadow:0 4px 16px #22c55e55;margin-bottom:14px;text-decoration:none;cursor:pointer;">
      Redeem Now
    </a>

    <!-- Close Button -->
    <button onclick="document.getElementById('popup-congrats').style.display='none'"
      style="background:#ffd43b;font-size:16px;font-weight:700;color:#6d4600;padding:10px 36px;border:none;border-radius:8px;box-shadow:0 2px 12px #ffd43b55;cursor:pointer;">
      Close
    </button>

  </div>
</div>

<script>
  let spun = false;
  document.getElementById("spinBtn").onclick = function () {
    if (spun) return;

    let fullSpins = 3; 
    let finalAngle = -(fullSpins * 360 + 90); // Always lands on winning side

    const box = document.getElementById("spin-box");
    box.style.transform = "rotateY(" + finalAngle + "deg)";
    spun = true;
    this.disabled = true;
    this.innerText = "Spinning...";

    setTimeout(function(){
      document.getElementById("popup-congrats").style.display = "flex";
      document.getElementById("spinBtn").innerText = "Congratulations!";
      document.getElementById("spinBtn").style.background = "#22e46a";
      document.getElementById("spinBtn").style.cursor = "not-allowed";
    }, 2100);
  };
</script>
